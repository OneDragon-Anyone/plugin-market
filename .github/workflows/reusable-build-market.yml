name: reusable-build-market

on:
  workflow_call:
    inputs:
      tools_repository:
        description: 工具仓的仓库坐标，由调用方指定
        type: string
        required: true
      tools_ref:
        description: 工具仓的 tag 或分支，不传时取该仓最新的版本 tag
        type: string
        required: false
      site_url:
        description: 站点地址，不传时按 GitHub Pages 的域名；自定义域名才需要传
        type: string
        required: false
      site_base_path:
        description: 站点部署的子路径，不传按调用方的仓库名，部署在域名根时传 /
        type: string
        required: false
    secrets:
      CNB_TOKEN:
        description: CNB 访问令牌 提交索引与封面必需 未配置时跳过索引镜像
        required: false

env:
  SITE_URL: ${{ inputs.site_url || format('https://{0}.github.io', github.repository_owner) }}
  BASE_PATH: ${{ inputs.site_base_path || format('/{0}', github.event.repository.name) }}

jobs:
  build:
    # 与文件名、脚本名的干名一致；页面标题是「调用方 job 名 / 这个名字」
    name: build-market
    runs-on: ubuntu-latest
    steps:
      - name: Normalize site env
        id: site
        run: |
          # 首尾多余的斜杠都收掉 再补一个前导 拼地址才不会出双斜杠
          url=$(printf '%s' "$SITE_URL" | sed 's#/*$##')
          base=$(printf '%s' "$BASE_PATH" | sed 's#^/*##; s#/*$##')
          if [ -n "$base" ]; then base="/${base}"; fi
          case "$url" in https://?* | http://?*) ;; *) echo "::error::site_url 需要带协议的完整地址"; exit 1 ;; esac
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      # 调用方即数据仓（plugin-data）：checkout 默认落在工作区根目录
      - name: Checkout data repository
        uses: actions/checkout@v6

      # 坐标与提交都取自这个 workflow 文件本身：调用方 uses 指向哪个仓、哪个 ref，这里就检出哪个，
      # 不用把市场仓写成参数
      - name: Checkout market
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tools
          persist-credentials: false

      - name: Checkout lock branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin lock >/dev/null; then
            git fetch --depth=1 origin lock:lock
            git worktree add .lock lock
          else
            git worktree add --orphan -b lock .lock
          fi

      - name: Resolve tools ref
        id: tools
        env:
          REPO: ${{ inputs.tools_repository }}
          REF: ${{ inputs.tools_ref }}
        run: |
          # 仓库变量粘贴时容易带上换行 先清掉再拼地址
          REPO=$(printf '%s' "$REPO" | tr -d '[:space:]')
          REF=$(printf '%s' "$REF" | tr -d '[:space:]')
          if [ -z "$REPO" ]; then
            echo "::error::调用方没有指定工具仓坐标"
            exit 1
          fi
          if [ -n "$REF" ]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 留空时取该仓最新的版本 tag，取不到就让这一步失败，不退到默认分支
          # 不吞 stderr：查询失败和仓里确实没有 tag 要能分开看
          if ! tags=$(git ls-remote --tags --refs "https://github.com/${REPO}.git" 2>&1); then
            echo "::error::读取 ${REPO} 的 tag 失败"
            printf '%s\n' "$tags"
            exit 1
          fi
          latest=$(printf '%s\n' "$tags" \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            echo "::error::${REPO} 没有版本 tag"
            exit 1
          fi
          echo "ref=$latest" >> "$GITHUB_OUTPUT"

      - name: Checkout plugin-tools
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.tools_repository }}
          ref: ${{ steps.tools.outputs.ref }}
          path: .plugin-tools
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        working-directory: .tools
        run: pnpm install --frozen-lockfile

      - name: Build market data
        working-directory: .tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          MARKET_DATA_DIR: ${{ github.workspace }}
          MARKET_SHA: ${{ job.workflow_sha }}
          # 市场仓坐标与 ref，摘要里用来说明这份索引由哪个仓、哪个版本构建
          MARKET_REPOSITORY: ${{ job.workflow_repository }}
          MARKET_REF: ${{ job.workflow_ref }}
          LOCK_DIR: ${{ github.workspace }}/.lock
          TOOLS_DIR: ${{ github.workspace }}/.plugin-tools
          TOOLS_REPOSITORY: ${{ inputs.tools_repository }}
          # 摘要里显示的工具版本就是这个 tag
          TOOLS_REF: ${{ steps.tools.outputs.ref }}
          PREVIOUS_API_URL: ${{ steps.site.outputs.url }}${{ steps.site.outputs.base }}/api/v1/
          MARKET_OPEN_ISSUES: "true"
        run: pnpm market:build

      - name: Commit lock branch
        working-directory: .lock
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "lock unchanged"
            exit 0
          fi
          git commit -m "chore: update sources lock (${GITHUB_SHA::7})"
          git push origin lock

      - name: Build site
        working-directory: .tools
        run: pnpm build
        env:
          # 站点品牌与客户端名从数据仓 policy.json 读，构建期注入前端
          MARKET_DATA_DIR: ${{ github.workspace }}
          PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
          SITE_URL: ${{ steps.site.outputs.url }}
          PUBLIC_BASE_PATH: ${{ steps.site.outputs.base || '/' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .tools/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
