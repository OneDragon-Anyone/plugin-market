name: Reusable Validate Market

on:
  workflow_call:
    inputs:
      template_repository:
        description: 模板仓的仓库坐标，不传时用 OneDragon-Anyone/plugin-template
        type: string
        required: false
        default: OneDragon-Anyone/plugin-template
      template_ref:
        description: 模板仓的 tag 或分支，不传时取该仓最新的版本 tag
        type: string
        required: false

jobs:
  validate:
    # 名称即数据仓 ruleset 中的必需检查；机器人 PR 由提交机器人写入同名 commit status
    name: market/validate
    runs-on: ubuntu-latest
    steps:
      # pull_request 事件下默认检出数据仓的 PR 合并提交
      - name: Checkout data repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout tools
        uses: actions/checkout@v6
        with:
          repository: OneDragon-Anyone/plugin-market
          # 取当前 reusable workflow 所在提交，避免调用方改了版本号这里没跟上
          ref: ${{ job.workflow_sha }}
          path: .tools
          persist-credentials: false

      - name: Resolve template ref
        id: template
        env:
          REPO: ${{ inputs.template_repository }}
          REF: ${{ inputs.template_ref }}
        run: |
          if [ -n "$REF" ]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 留空时取该仓最新的版本 tag，取不到就让这一步失败，不退到默认分支
          # 不吞 stderr：查询失败和仓里确实没有 tag 要能分开看
          if ! tags=$(git ls-remote --tags --refs "https://github.com/${REPO}.git" 2>&1); then
            echo "::error::读取 ${REPO} 的 tag 失败"
            printf '%s\n' "$tags"
            exit 1
          fi
          latest=$(printf '%s\n' "$tags" \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            echo "::error::${REPO} 没有版本 tag"
            exit 1
          fi
          echo "ref=$latest" >> "$GITHUB_OUTPUT"

      - name: Checkout template tools
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ steps.template.outputs.ref }}
          path: .plugin-template
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        working-directory: .tools
        run: pnpm install --frozen-lockfile

      - name: Generate Astro types
        working-directory: .tools
        run: pnpm exec astro sync

      - name: Type check
        working-directory: .tools
        run: pnpm check

      - name: Validate market entries
        working-directory: .tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_DATA_DIR: ${{ github.workspace }}
          TEMPLATE_DIR: ${{ github.workspace }}/.plugin-template
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'market/plugins/*.json' \
            | xargs -r -n1 basename | sed 's/\.json$//' | paste -sd, -)
          pnpm market:check --resolve --deep "$changed"
