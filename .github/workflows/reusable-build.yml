name: Reusable Build Market

on:
  workflow_call:
    inputs:
      template_repository:
        description: 模板仓的仓库坐标，不传时用 OneDragon-Anyone/plugin-template
        type: string
        required: false
        default: OneDragon-Anyone/plugin-template
      template_ref:
        description: 模板仓的 tag 或分支，不传时取该仓最新的版本 tag
        type: string
        required: false
    secrets:
      CNB_TOKEN:
        description: CNB 访问令牌 提交索引与封面必需 未配置时跳过索引镜像
        required: false

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
  BASE_PATH: ${{ vars.SITE_BASE_PATH || '/plugin-data' }}

jobs:
  build:
    name: market/build
    runs-on: ubuntu-latest
    steps:
      # 调用方即数据仓（plugin-data）：checkout 默认落在工作区根目录
      - name: Checkout data repository
        uses: actions/checkout@v6

      - name: Checkout tools
        uses: actions/checkout@v6
        with:
          repository: OneDragon-Anyone/plugin-market
          # 取当前 reusable workflow 所在提交，避免调用方改了版本号这里没跟上
          ref: ${{ job.workflow_sha }}
          path: .tools
          persist-credentials: false

      - name: Checkout lock branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin lock >/dev/null; then
            git fetch --depth=1 origin lock:lock
            git worktree add .lock lock
          else
            git worktree add --orphan -b lock .lock
          fi

      - name: Resolve template ref
        id: template
        env:
          REPO: ${{ inputs.template_repository }}
          REF: ${{ inputs.template_ref }}
        run: |
          # 仓库变量粘贴时容易带上换行 先清掉再拼地址
          REPO=$(printf '%s' "$REPO" | tr -d '[:space:]')
          REF=$(printf '%s' "$REF" | tr -d '[:space:]')
          if [ -n "$REF" ]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 留空时取该仓最新的版本 tag，取不到就让这一步失败，不退到默认分支
          # 不吞 stderr：查询失败和仓里确实没有 tag 要能分开看
          if ! tags=$(git ls-remote --tags --refs "https://github.com/${REPO}.git" 2>&1); then
            echo "::error::读取 ${REPO} 的 tag 失败"
            printf '%s\n' "$tags"
            exit 1
          fi
          latest=$(printf '%s\n' "$tags" \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            echo "::error::${REPO} 没有版本 tag"
            exit 1
          fi
          echo "ref=$latest" >> "$GITHUB_OUTPUT"

      - name: Checkout template tools
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ steps.template.outputs.ref }}
          path: .plugin-template
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        working-directory: .tools
        run: pnpm install --frozen-lockfile

      - name: Build market data
        working-directory: .tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          MARKET_DATA_DIR: ${{ github.workspace }}
          MARKET_SHA: ${{ job.workflow_sha }}
          MARKET_REF: ${{ job.workflow_ref }}
          LOCK_DIR: ${{ github.workspace }}/.lock
          TEMPLATE_DIR: ${{ github.workspace }}/.plugin-template
          TEMPLATE_REPOSITORY: ${{ inputs.template_repository }}
          # 摘要里显示的模板版本就是这个 tag
          TEMPLATE_REF: ${{ steps.template.outputs.ref }}
          PREVIOUS_API_URL: ${{ env.SITE_URL }}${{ env.BASE_PATH }}/api/v1/
          MARKET_OPEN_ISSUES: "true"
        run: pnpm market:build

      - name: Commit lock branch
        working-directory: .lock
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "lock unchanged"
            exit 0
          fi
          git commit -m "chore: update sources lock (${GITHUB_SHA::7})"
          git push origin lock

      - name: Build site
        working-directory: .tools
        run: pnpm build
        env:
          PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
          PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .tools/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
