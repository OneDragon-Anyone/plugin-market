name: Reusable Submission Bot

on:
  workflow_call:
    inputs:
      template_repository:
        description: 模板仓的仓库坐标，不传时用 OneDragon-Anyone/plugin-template
        type: string
        required: false
        default: OneDragon-Anyone/plugin-template
      template_ref:
        description: 模板仓的 tag，不传时用 v1
        type: string
        required: false
        default: v1

env:
  BASE_PATH: ${{ vars.SITE_BASE_PATH || '/plugin-data' }}

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      # 始终检出数据仓默认分支；pull_request_target 下也不运行 PR 中的代码
      - name: Checkout data repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout tools
        uses: actions/checkout@v6
        with:
          repository: OneDragon-Anyone/plugin-market
          # 取当前 reusable workflow 所在提交，避免调用方改了版本号这里没跟上
          ref: ${{ job.workflow_sha }}
          path: .tools
          persist-credentials: false

      - name: Checkout template tools
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: .plugin-template
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        working-directory: .tools
        run: pnpm install --frozen-lockfile

      - name: Run submission bot
        working-directory: .tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_DATA_DIR: ${{ github.workspace }}
          TEMPLATE_DIR: ${{ github.workspace }}/.plugin-template
          MARKET_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MARKET_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}${{ env.BASE_PATH }}/
        run: pnpm market:bot
